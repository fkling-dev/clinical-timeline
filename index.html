<style>
  :root{
    --bg:#F3F5F3;
    --panel:#FFFFFF;
    --border:#DCE1DE;
    --ink:#1E2A24;
    --ink-soft:#5B6A62;
    --accent:#2A5C99;
    --accent-soft:#DCE7F5;
    --warn-bg:#FBEAE3;
    --warn-ink:#8A3213;
    --sans:'IBM Plex Sans', Arial, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--border);
    flex-wrap:nowrap;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .brand-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .brand .mark{
    width:26px;height:26px;position:relative;flex:none;
  }
  .brand .mark svg,.brand .mark img{width:100%;height:100%;display:block;border-radius:4px;}
  .brand h1{font-size:12.5px;line-height:1.25;margin:0;font-weight:700;letter-spacing:0.01em;white-space:nowrap;}
  .brand-by{font-weight:500;color:var(--ink-soft);}
  .brand .sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .exportbar{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;flex:none;}
  .toolbar-sep{width:1px;align-self:stretch;background:var(--border);margin:0 2px;}
  .lang-select{font-family:var(--sans);font-size:12px;font-weight:600;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;width:auto;min-width:0;flex:none;}
  .exportbar .btn{white-space:nowrap;flex:none;}

  .btn{
    font-family:var(--sans);font-size:12.5px;font-weight:600;
    background:var(--accent);color:#fff;border:none;border-radius:6px;
    padding:8px 14px;cursor:pointer;transition:background .15s;
  }
  .btn:hover{background:#1E4A7A;}
  .btn:disabled{opacity:0.6;cursor:default;}
  .btn.secondary{background:var(--accent-soft);color:var(--accent);}
  .btn.has-changes{background:#E11D2A !important;color:#fff !important;animation:btnPulse 1.4s ease-in-out infinite;}
  @keyframes btnPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(225,29,42,0.55);}
    50%{box-shadow:0 0 0 7px rgba(225,29,42,0);}
  }
  .btn.secondary:hover{background:#c5d9ef;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
  .btn.ghost:hover{background:#eef1ef;}
  .btn.small{padding:5px 10px;font-size:11.5px;}

  main{flex:1;display:flex;min-height:0;}
  aside{
    width:430px;flex:none;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  #tabnav{
    display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;position:relative;min-width:0;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  #tabnav::-webkit-scrollbar{display:none;width:0;height:0;}
  .tabbtn{
    font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--ink-soft);flex:none;
    background:none;border:none;border-radius:7px;padding:4px 10px;margin-right:3px;cursor:pointer;white-space:nowrap;
    line-height:1.3;transition:background .12s,color .12s;
  }
  .tabbtn:hover{background:#EEF1EE;color:var(--ink);}
  /* Aktiver Bereich: BVB-Gelb mit abgerundeten Ecken */
  .tabbtn.active,.tabbtn.active:hover{background:#FDE100;color:#111;font-weight:700;}
  #tabpanel{flex:1;overflow-y:auto;padding:12px 18px 60px;}

  .panel-body{display:flex;flex-direction:column;gap:2px;}
  .field{display:flex;flex-direction:column;gap:4px;font-size:12px;flex:1;}
  .field.narrow{flex:0 0 auto;min-width:0;}
  .field-label{color:var(--ink);font-weight:500;font-size:12px;line-height:1.3;}
  .field-label-row{display:flex;align-items:center;gap:6px;min-width:0;}
  /* Einstellungen in Tabs: Label links, Steuerelement rechts (eine Zeile pro Einstellung) */
  .panel-body .field:not(.inline){padding:6px 0;}
  .panel-body .field.inline{
    display:grid;grid-template-columns:minmax(0,1fr) 190px;column-gap:14px;align-items:center;
    flex:none;padding:7px 2px;border-bottom:1px solid #EEF1EE;
  }
  .panel-body .field.inline > .field-label-row{grid-column:1;}
  .panel-body .field.inline > :not(.field-label-row){grid-column:2;}
  .panel-body .field.inline input[type=color]{justify-self:end;width:56px;}
  .panel-body .field.inline input[type=checkbox]{justify-self:end;}
  .panel-body .field.inline .slider-wrap{width:100%;}
  .panel-body .row{gap:12px;}
  .panel-body .toolbar-gap{margin-bottom:12px;}
  /* Therapiezyklen */
  .cycle-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .cycle-item{border:1px solid var(--border);border-radius:8px;padding:6px 12px 8px;margin:6px 0;background:#FFFFFF;display:flex;flex-direction:column;gap:2px;}
  .cycle-item-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--accent);padding:2px 0;}
  .cycle-row{display:grid;grid-template-columns:auto minmax(0,1fr) 96px 34px auto;gap:6px;align-items:center;margin:4px 0;}
  .cycle-row input[type=text]{min-width:0;width:100%;}
  .cycle-row input[type=color]{width:34px;padding:1px;}
  .subtoggle{display:flex;align-items:center;gap:6px;background:none;border:none;border-bottom:1px solid var(--border);padding:8px 2px 6px;margin-top:6px;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink);text-align:left;}
  .subtoggle:hover{color:var(--accent);}
  .day-chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0 4px;}
  .day-chip{min-width:32px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:#FFFFFF;font-family:var(--sans);font-size:11.5px;cursor:pointer;}
  .day-chip:hover{border-color:var(--accent);}
  .day-chip.off{background:#F7E4E0;color:#9A4B3A;border-color:#E6BDB3;text-decoration:line-through;}
  #preview rect.cycle-cell:hover{fill:#EAF3FF;}
  #preview rect.cycle-day:hover{fill:#FFF3B0;}
  .cycle-datemarks{margin-top:8px;padding-top:6px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
  .popover-sub{font-size:11.5px;font-weight:700;color:var(--accent);padding:2px 0;}
  .popover-check.disabled{opacity:.5;}
  .popover-date-preview{font-size:12px;color:var(--ink-soft);}
  .panel-body .row:has(> .field.inline){flex-direction:column;gap:0;}
  .field-icon{
    flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:15px;border-radius:4px;font-size:9.5px;font-weight:800;
    font-family:var(--sans);line-height:1;
  }
  .field-icon-gap{background:#E3ECF7;color:#2A5C99;}
  .field-icon-size{background:#F3E7D8;color:#8A5A1E;font-style:italic;}
  .field-icon-line{background:#E1EEE1;color:#2F6B3A;}
  .field-icon-color{background:none;font-size:12px;width:auto;}
  .style-section-title{
    font-size:14px;font-weight:800;color:#fff;background:var(--accent);
    padding:8px 12px;border-radius:6px;margin:30px 0 8px;letter-spacing:0.01em;
  }
  .style-section-title.with-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .style-section-title.with-toggle .ios-toggle .slider{background:rgba(255,255,255,0.4);}
  .style-section-title.with-toggle .ios-toggle input:checked + .slider{background:#fff;}
  .style-section-title.with-toggle .ios-toggle .slider::before{background:var(--accent);}
  .group-toggle{
    display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;
    border-bottom:1px solid var(--accent-soft);padding:0 0 6px;margin:22px 0 8px;cursor:pointer;
    font-family:var(--sans);color:var(--accent);text-align:left;
  }
  .group-toggle:hover{color:#1E4A7A;}
  .group-toggle-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:700;}
  .style-subsection-title{
    font-size:11.5px;font-weight:700;color:var(--accent);text-transform:uppercase;
    letter-spacing:0.05em;margin:24px 0 4px;border-bottom:1px solid var(--accent-soft);padding-bottom:5px;
  }
  .field-legend{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-soft);margin:6px 0 0;flex-wrap:wrap;}
  .row{display:flex;gap:10px;}
  .row .field{flex:1;}
  input[type=text],input[type=number],select{
    font-family:var(--sans);font-size:13px;padding:7px 8px;border:1px solid var(--border);
    border-radius:5px;background:#fff;color:var(--ink);width:100%;
  }
  input[type=color]{width:44px;height:32px;padding:2px;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;}
  input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;}
  .hint{font-size:11.5px;color:var(--ink-soft);line-height:1.5;background:#F4F6F4;border:1px solid var(--border);padding:8px 10px;border-radius:6px;}
  .section-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin-top:4px;}
  .section-title.small{margin-top:2px;font-size:10.5px;}
  .divider{border-top:1px solid var(--border);margin:6px 0;}

  .card{border:1px solid var(--border);border-radius:8px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:3px;background:#FAFBFA;margin-bottom:10px;}
  .card.conflict{border-color:#D98A6E;background:var(--warn-bg);}
  .card-head{display:flex;align-items:center;gap:8px;}
  .card-title{font-size:12.5px;font-weight:700;color:var(--ink);flex:1;}
  .icon-btn{border:none;background:#eee;color:var(--ink-soft);width:22px;height:22px;border-radius:5px;cursor:pointer;font-size:11px;line-height:1;}
  .icon-btn.danger{background:#F6DCD4;color:#8A3213;}
  .icon-btn.danger:hover{background:#EFC3B6;}
  .icon-btn.small{width:20px;height:20px;font-size:10px;}

  .point-table{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto;padding-right:2px;}
  .point-row{display:grid;grid-template-columns:1fr 1fr 22px;gap:6px;align-items:center;}
  .point-row.events{grid-template-columns:70px 1fr 22px;align-items:start;}
  .point-row.states{grid-template-columns:34px 1fr 1fr 1fr 22px;align-items:start;}
  .point-row input{padding:5px 6px;font-size:12px;}
  .label-textarea{width:100%;box-sizing:border-box;padding:5px 6px;font-size:12px;font-family:var(--sans);border:1px solid var(--border);border-radius:5px;resize:vertical;min-height:30px;}
  .point-row input[type=color]{width:100%;height:28px;padding:2px;}
  .point-row.conflict{background:var(--warn-bg);border-radius:5px;box-shadow:0 0 0 1px #D98A6E inset;}

  .move-btns{display:flex;flex-direction:column;gap:1px;margin-right:2px;}
  .move-btns .icon-btn{width:18px;height:16px;font-size:9px;padding:0;}
  .move-btns .icon-btn:disabled{opacity:0.3;cursor:default;}
  .row-card.header{border-left:3px solid var(--ink-soft);}
  .row-card.event{border-left:3px solid var(--accent);}
  .row-card.state{border-left:3px solid #B08900;}
  .row-card.values{border-left:3px solid #7A4FA3;}
  .row-card.collapsed{padding-bottom:8px;}
  .series-card{border-left:3px solid var(--accent);}
  .series-card.collapsed{padding-bottom:8px;}
  .series-meta{margin-left:auto;padding-left:8px;font-size:10.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;}
  .row-card .card-head{gap:6px;}
  .card-title-btn{flex:1;display:flex;align-items:center;gap:6px;background:none;border:none;padding:4px 2px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;font-family:var(--sans);}
  .card-title-btn:hover{color:var(--accent);}
  .expand-arrow{color:var(--ink-soft);font-size:10px;width:10px;display:inline-block;}
  .inactive-card{opacity:0.55;}

  .ios-toggle{position:relative;display:inline-block;width:34px;height:19px;flex:none;cursor:pointer;}
  .ios-toggle input{opacity:0;width:0;height:0;position:absolute;}
  .ios-toggle .slider{position:absolute;inset:0;background:#CBD3CE;transition:background .15s;border-radius:19px;}
  .ios-toggle .slider::before{position:absolute;content:"";height:15px;width:15px;left:2px;top:2px;background:#fff;transition:transform .15s;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,0.3);}
  .ios-toggle input:checked + .slider{background:var(--accent);}
  .ios-toggle input:checked + .slider::before{transform:translateX(15px);}

  .popover{
    position:fixed;z-index:1000;background:#fff;border:1px solid var(--border);border-radius:8px;
    box-shadow:0 4px 16px rgba(30,42,36,0.22);padding:12px 14px;min-width:220px;max-width:300px;
    font-family:var(--sans);
  }
  .popover.menu{padding:6px;}
  .file-menu{display:flex;flex-direction:column;gap:2px;min-width:230px;}
  .file-menu-item{
    display:flex;align-items:center;gap:9px;text-align:left;background:none;border:none;
    padding:9px 10px;border-radius:6px;font-size:13px;color:var(--ink);cursor:pointer;font-family:var(--sans);
  }
  a.file-menu-item{text-decoration:none;box-sizing:border-box;}
  .file-menu-item:hover{background:var(--accent-soft);}
  .file-menu-item .icon{width:18px;text-align:center;flex:none;}
  .file-menu-item.danger-ish{color:var(--ink-soft);}
  .file-menu-sep{height:1px;background:var(--border);margin:5px 2px;}
  .file-menu-label{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;padding:6px 10px 2px;}
  .popover-body{display:flex;flex-direction:column;gap:8px;}
  .popover-body.wide{min-width:270px;}
  .paste-area{width:100%;font-family:var(--mono);font-size:11.5px;padding:8px;border:1px solid var(--border);border-radius:5px;resize:vertical;box-sizing:border-box;}
  .popover-title{font-size:12.5px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:2px;}
  .popover-subtitle{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.02em;margin-top:4px;}
  .marks-list{display:flex;flex-direction:column;gap:5px;max-height:180px;overflow-y:auto;}
  .mark-row{display:grid;grid-template-columns:16px auto 26px 1fr 20px;gap:6px;align-items:start;font-size:11.5px;}
  .mark-row input[type=color]{width:100%;height:22px;padding:1px;}
  .mark-row.inactive{opacity:0.5;}
  .mark-row .mark-pos{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;}
  .mark-row input[type=text]{padding:4px 6px;font-size:11px;}
  .mark-row .label-textarea{padding:4px 6px;font-size:11px;min-height:22px;}
  .mark-row input[type=checkbox]{margin-top:5px;}
  .hint.small{font-size:10.5px;padding:6px 8px;}
  .popover-check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;}
  .ms-choice-list{display:flex;flex-direction:column;gap:3px;max-height:260px;overflow-y:auto;}
  .ms-group-head{
    display:flex;align-items:center;gap:6px;width:100%;flex:none;text-align:left;cursor:pointer;
    background:none;border:none;border-bottom:1px solid var(--accent-soft);
    padding:4px 2px;margin:7px 0 2px;font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--accent);
  }
  .ms-group-head:hover{color:#1E4A7A;}
  .ms-group-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-choice{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid transparent;}
  .ms-choice:hover{background:#F4F6F4;}
  .ms-choice.selected{background:var(--accent-soft);border-color:#B9CDE8;}
  .ms-choice input[type=radio]{margin:0;accent-color:var(--accent);flex:none;}
  .ms-swatch{flex:none;display:block;}
  .ms-choice-text{display:flex;flex-direction:column;min-width:0;}
  .ms-choice-label{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;}
  .ms-card-preview{display:inline-flex;flex:none;}
  .ms-usage{font-size:10.5px;color:var(--ink-soft);background:#EEF1EF;border-radius:10px;padding:2px 8px;white-space:nowrap;}

  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;}
  .slider-wrap{display:flex;align-items:center;gap:8px;min-width:120px;}
  .slider-wrap input[type=range]{flex:1;min-width:60px;margin:0;}
  .slider-val{flex:none;min-width:52px;white-space:nowrap;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink);}

  .chipbar{display:flex;flex-wrap:wrap;gap:6px;}
  /* Hinzufuegen-Schaltflaechen: deutlicher Abstand zu den Boxen darueber/darunter (alle Tabs) */
  .panel-body > .chipbar{margin-bottom:18px;}
  .panel-body > .card + .btn, .panel-body > .card + .chipbar{margin-top:18px;}
  .card > .btn.small, .card > .chipbar{margin-top:14px;}
  .card > .cycle-item:last-of-type + .btn, .card > .cycle-row + .btn{margin-top:14px;}
  .card > .item-row + .btn, .card > .point-row + .btn{margin-top:12px;}
  .chip{border:1px solid var(--border);background:#fff;border-radius:14px;padding:5px 11px;font-size:11.5px;cursor:pointer;color:var(--ink-soft);}
  .chip:hover{border-color:var(--accent);color:var(--accent);}

  .warning{background:var(--warn-bg);color:var(--warn-ink);font-size:11.5px;padding:6px 9px;border-radius:5px;margin-top:6px;}
  .warning.small{margin-top:0;}

  section#previewWrap{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);}
  .previewbar{
    display:flex;align-items:center;justify-content:space-between;padding:10px 18px;
    border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;gap:8px;
  }
  .previewbar .field{flex:0 0 auto;}
  #warnings{padding:0 18px;}
  #previewScroll{flex:1;min-height:0;overflow:auto;padding:24px;display:flex;}
  .welcome{max-width:480px;text-align:center;padding:40px 32px;margin:auto;}
  .welcome-title{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:12px;}
  .welcome-text{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:26px;}
  .welcome-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch;}
  .welcome-actions .btn{width:100%;}
  #preview{
    flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;
    background:#fff;box-shadow:0 1px 3px rgba(30,42,36,0.12), 0 8px 24px rgba(30,42,36,0.08);border-radius:2px;
  }
  #preview svg{display:block;max-width:100%;max-height:100%;width:auto;height:auto;}
  #preview rect.state-rect.conflict{stroke:#C1461F;stroke-width:2.4;stroke-dasharray:4 2;}
  #preview .clickable-item{cursor:pointer;}
  #preview .clickable-item:hover{opacity:0.82;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#CBD3CE;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 880px){
    header{flex-wrap:wrap;}
    .exportbar{flex-wrap:wrap;}
    main{flex-direction:column;}
    aside{width:100%;max-height:46vh;border-right:none;border-bottom:1px solid var(--border);}
  }
</style>
</head>
